<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalFirst Paste Shield — Local Interactive Sandbox</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0c10;
        color: #f8fafc;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }
      .card {
        background: #12141b;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 18px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      p {
        margin: 0 0 12px;
        color: #94a3b8;
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #00e5a3;
      }
      #sim-ai-chat {
        min-height: 110px;
        background: #07090d;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        color: #f8fafc;
        outline: none;
      }
      #sim-github-issue {
        width: 100%;
        box-sizing: border-box;
        min-height: 110px;
        background: #07090d;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 10px;
        padding: 12px;
        font-size: 13px;
        font-family: ui-monospace, Menlo, monospace;
        color: #f8fafc;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>LocalFirst Live Browser Paste Shield — Sandbox</h1>
        <p>
          Paste any incident log, API key, JWT, or clinical note into either box below. The MV3 Paste Shield intercepts sensitive pastes in capture phase before the page DOM sees a single byte.
        </p>
      </section>

      <section class="card">
        <label for="sim-ai-chat">Simulated AI Chat (ProseMirror-style contenteditable)</label>
        <div
          id="sim-ai-chat"
          contenteditable="true"
          role="textbox"
          aria-label="Simulated AI Chat"
        ></div>
      </section>

      <section class="card">
        <label for="sim-prosemirror">Simulated ChatGPT Nested ProseMirror (&lt;div contenteditable&gt;&lt;p&gt;)</label>
        <div
          id="sim-prosemirror"
          contenteditable="true"
          role="textbox"
          aria-label="Simulated ChatGPT Nested ProseMirror"
          style="min-height:90px;background:#07090d;border:1px solid rgba(148,163,184,0.24);border-radius:10px;padding:12px;font-size:14px;color:#f8fafc;outline:none;"
        ><p><br></p></div>
      </section>

      <section class="card">
        <label for="sim-github-issue">Simulated GitHub Issue (&lt;textarea&gt;)</label>
        <textarea
          id="sim-github-issue"
          aria-label="Simulated GitHub Issue"
          placeholder="Paste logs or stack traces here..."
        ></textarea>
      </section>
    </main>
  </body>
</html>
